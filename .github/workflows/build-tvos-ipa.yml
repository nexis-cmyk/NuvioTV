name: Build tvOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This app uses the tvOS 26 Liquid Glass APIs, which require Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build prerequisites
        run: brew install cmake

      - name: Build the tvOS QuickJS dependency
        run: ./scaffolding/build-quickjs-tvos.sh "$RUNNER_TEMP/quickjs-kt-tvos"

      - name: Check out the customized tvOS source
        run: |
          rm -rf NuvioMobile
          git clone --branch codex/catalog-fix --depth 1 \
            "https://github.com/${{ github.repository_owner }}/NuvioMobile.git" NuvioMobile
          cd NuvioMobile
          git submodule update --init MPVKit

      - name: Build unsigned Apple TV app
        working-directory: NuvioMobile
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme NuvioTV \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -derivedDataPath iosApp/build/tvos-ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: NuvioMobile
        run: |
          PRODUCTS="iosApp/build/tvos-ipa/Build/Products/Release-appletvos"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$PRODUCTS/NuvioTV.app" "$RUNNER_TEMP/Payload/"
          # Free-Apple-ID re-signers cannot preserve the tvOS extension signature.
          rm -rf "$RUNNER_TEMP/Payload/NuvioTV.app/PlugIns"
          cd "$RUNNER_TEMP"
          zip -qry NuvioTV.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-unsigned-IPA
          path: ${{ runner.temp }}/NuvioTV.ipa
          if-no-files-found: error
